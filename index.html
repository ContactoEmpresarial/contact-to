<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Tomas Oliveira | UNICRE</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e7e9ee;--soft:#f6f7f9}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 55px rgba(17,24,39,.12);overflow:hidden;position:relative}.cover{height:210px;background:#fff;display:flex;align-items:center;justify-content:center;padding:18px 28px 30px;border-bottom:1px solid #f0f1f3}.cover img{width:100%;height:100%;object-fit:contain}.qr-trigger{position:absolute;top:16px;right:16px;width:42px;height:42px;border:1px solid rgba(17,24,39,.10);border-radius:13px;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.07);z-index:2}.qr-trigger svg{width:21px;height:21px}.profile{position:relative;padding:58px 28px 28px}.avatar,.initials{position:absolute;top:-48px;left:28px;width:96px;height:96px;border-radius:50%;border:5px solid #fff;box-shadow:0 5px 18px rgba(17,24,39,.12)}.avatar{object-fit:cover;background:#eee}.initials{display:grid;place-items:center;background:#111827;color:#fff;font-size:28px;font-weight:650}h1{font-size:28px;line-height:1.1;margin:0 0 7px;letter-spacing:-.02em}.role{font-size:16px;color:var(--muted);margin:0}.company{font-size:14px;font-weight:650;margin-top:5px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0 14px}.quick a{text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:12px 6px 10px;text-align:center;font-size:12px;font-weight:600}.quick svg{display:block;width:21px;height:21px;margin:0 auto 6px}.save{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;text-decoration:none;background:#111827;color:#fff;border-radius:16px;padding:15px;font-weight:650;font-size:15px}.save svg{width:19px}.footer{text-align:center;color:#98a2b3;font-size:11px;margin-top:20px}.modal{position:fixed;inset:0;background:rgba(255,255,255,.98);display:none;place-items:center;padding:28px;text-align:center;z-index:20}.modal.open{display:grid}.qrbox{width:min(390px,100%)}.qrbox h2{font-size:27px;margin:0 0 7px}.qrbox p{color:var(--muted);margin:0 0 22px}.qrimg{width:min(76vw,320px);aspect-ratio:1;background:#fff}.close{margin-top:22px;border:1px solid var(--line);background:var(--soft);padding:12px 22px;border-radius:13px;font-weight:650;cursor:pointer}@media(max-width:360px){body{padding:0}.card{border-radius:0;min-height:100vh}.cover{height:195px}}
</style></head><body>

<section class="cover"><img src="unicre-cover.jpg" alt="UNICRE — Unlocking Futures"></section>

<div class="footer">UNICRE · Unlocking Futures</div></section></main>
<section class="modal" id="qrModal"><div class="qrbox"><h2>Tomas Oliveira</h2><p>Digitalize para abrir o cartão de contacto.</p><img class="qrimg" id="qrImage" alt="QR Code"><br><button class="close" id="closeQr">Fechar</button></div></section>
<script>const modal=document.getElementById('qrModal'),img=document.getElementById('qrImage');document.getElementById('showQr').onclick=()=>{const u=location.href.split('#')[0].split('?')[0];img.src='https://api.qrserver.com/v1/create-qr-code/?size=700x700&margin=12&data='+encodeURIComponent(u);modal.classList.add('open')};document.getElementById('closeQr').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};</script>
</body></html>
